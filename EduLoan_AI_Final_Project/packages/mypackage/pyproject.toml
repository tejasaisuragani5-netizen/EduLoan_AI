[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mypackage"
version = "0.1.0"
description = "A reusable Python package"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "black>=24.0.0", "ruff>=0.4.0"]

[tool.setuptools.packages.find]
where = ["src"]
